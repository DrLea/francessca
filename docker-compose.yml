services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: francessca
      POSTGRES_PASSWORD: francessca
      POSTGRES_DB: francessca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U francessca"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    # Set here (not only in .env) so the public deployment works even if .env
    # still carries the localhost values; compose environment wins over env_file.
    environment:
      API_PREFIX: /api
      ENABLE_DOCS: "false"
      FRONTEND_URL: ${PUBLIC_ORIGIN:-https://francesca.dpdns.org}
      BACKEND_URL: ${PUBLIC_ORIGIN:-https://francesca.dpdns.org}/api
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://francesca.dpdns.org}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-${OLLAMA_MODEL:-qwen2.5:3b-instruct}}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      # Desktop builds to serve (DOWNLOAD_DIR=/data/downloads). A named volume,
      # not a host path; copy files in with `docker cp` or a one-off container.
      - downloads:/data/downloads:ro
    ports:
      - "127.0.0.1:8000:8000"
    # Lets AI_PROVIDER=local reach an Ollama running on the host at
    # http://host.docker.internal:11434/v1 (already resolvable on Docker
    # Desktop; this adds it on plain Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      # NEXT_PUBLIC_* values are inlined into the client bundle at BUILD
      # time, so they have to be passed here, not only as runtime env.
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://francesca.dpdns.org/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_DOWNLOAD_WINDOWS: ${DOWNLOAD_WINDOWS:-}
        NEXT_PUBLIC_DOWNLOAD_MAC: ${DOWNLOAD_MAC:-}
        NEXT_PUBLIC_DOWNLOAD_LINUX: ${DOWNLOAD_LINUX:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://francesca.dpdns.org/api}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  uploads:
  downloads:
